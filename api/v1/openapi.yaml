      "put": {
        "operationId": "putKnowledgeFragment",
        "summary": "Register/update a source-owned KF snapshot",
        "description": "Scope fragments:write. Atomic legacy experience adapter for all producers in phase 1. Server-configured share_policy: merge retains other shares; replace revokes unlisted shares. Identical revision retries succeed; object key order ignored, array order/scalar types significant. No Idempotency-Key header is required. Specialized discussion UI migration is phase 4.",
