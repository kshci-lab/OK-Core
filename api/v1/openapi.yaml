  "components": {
    "securitySchemes": {
      "SourceBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Distinct app-owned token per system_code. Disabled systems cannot authenticate."
      },
      "ProducerContextBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Producer read token; distinct from the ingestion token used as the HMAC key."
      }
    },
    "schemas": {
      "Meta": {
        "type": "object",
        "properties": {
          "request_id": {
            "type": "string",
            "minLength": 1,
            "maxLength": 80,
            "pattern": "^[A-Za-z0-9._:-]{1,80}$"
          }
        },
        "required": [
          "request_id"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string",
                "minLength": 1
              },
              "message": {
                "type": "string",
                "minLength": 1
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "field": {
                      "type": "string",
                      "minLength": 0
                    },
                    "reason": {
                      "type": "string",
                      "minLength": 0
                    }
                  },
                  "required": [
                    "field",
                    "reason"
                  ]
                }
              }
            },
            "required": [
              "code",
              "message"
            ]
          },
          "meta": {
            "$ref": "#/components/schemas/Meta"
          }
        },
        "required": [
          "error",
          "meta"
        ]
      },
      "ContextResponse": {
        "type": "object",
        "properties": {
          "data": {
            "oneOf": [
              {
                "type": "object",
                "properties": {
                  "format": {
                    "const": "context-package.v1"
                  },
                  "external_kf_id": {
                    "type": "string"
                  },
                  "context_package": {
                    "type": "object",
                    "properties": {
                      "external_context_package_id": {
                        "type": "string"
                      },
                      "activity": {
                        "type": "object"
                      },
                      "items": {
                        "type": "array",
                        "items": {
                          "type": "object",
                          "properties": {
                            "entity_type_code": {
                              "type": "string"
                            },
                            "entity_id": {
                              "type": "string"
                            },
                            "display_order": {
                              "type": "integer"
                            },
                            "snapshot": {
                              "oneOf": [
                                {
                                  "type": "object"
                                },
                                {
                                  "type": "array",
                                  "maxItems": 0
                                }
                              ]
                            }
                          },
                          "required": [
                            "entity_type_code",
                            "entity_id",
                            "display_order",
                            "snapshot"
                          ]
                        }
                      }
                    },
                    "required": [
                      "external_context_package_id",
                      "activity",
                      "items"
                    ]
                  }
                },
                "required": [
                  "format",
                  "external_kf_id",
                  "context_package"
                ]
              },
              {
                "type": "object",
                "properties": {
                  "format": {
                    "const": "forest.thinking-process-map.v1"
                  },
                  "external_kf_id": {
                    "type": "string"
                  },
                  "map": {
                    "type": "object"
                  }
                },
                "required": [
                  "format",
                  "external_kf_id",
                  "map"
                ]
              }
            ]
          },
          "meta": {
            "$ref": "#/components/schemas/Meta"
          }
        },
        "required": [
          "data",
          "meta"
        ]
      }
    }
  }
}
