    "/knowledge-fragments/{external_kf_id}/context": {
      "get": {
        "operationId": "getProducerContextByKf",
        "summary": "Producer-owned context API (not hosted by OK-Core)",
        "servers": [
          {
            "url": "../../../forest-platform/api/v1",
            "description": "Forest reference; replace with registered producer API base."
          }
        ],
        "security": [
          {
            "ProducerContextBearer": []
          }
        ],
        "description": "OK-Core verifies active user, group and KF sharing before signing. Version context-v1 signs newline-separated fields: OK_CORE_CONTEXT_V1, system_code, GET, resource_path (without /api/v1 or query), format, external_kf_id, group_id, actor_sub, timestamp, legacy_reference (or empty), legacy_type (or empty). HMAC-SHA256 with that producer ingestion token, lowercase hex, timestamp tolerance 120 seconds. Forest IDs are positive INT strings. The package must belong to the active source KF. No Forest viewer registration/group membership is required. Legacy thinking-process-map grants remain supported.",
        "parameters": [
          {
            "name": "external_kf_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Acting-User-Sub",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Knowledge-Group-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-Source-System-Code",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-OK-Core-Proof-Version",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-OK-Core-Proof-Time",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-OK-Core-Proof",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-KF-Source-Reference",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "X-KF-Source-Type",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "format",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "context-package.v1",
                "forest.thinking-process-map.v1"
              ],
              "default": "context-package.v1"
            }
          },
          {
            "name": "X-External-KF-Id",
            "in": "header",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Context retrieved",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ContextResponse"
                }
              }
            }
          },
          "401": {
            "description": "Invalid read token",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Invalid, modified or expired grant",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Missing or deleted KF, package or record",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
